name: Install Caddy CLI
description: >
  Use the caddy already on PATH (our own runners bake it into the image), or
  install the official release binary. No apt source: the Cloudsmith repo
  answers 402 Payment Required since 10-10-2026, and on a long-lived runner a
  sources.list entry left behind breaks every later job's apt-get update.
inputs:
  version:
    description: Caddy version to install when none is on PATH
    default: '2.11.4'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CADDY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if command -v caddy >/dev/null; then
          echo "caddy on PATH: $(caddy version)"
          exit 0
        fi
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
        tarball="caddy_${CADDY_VERSION}_linux_${arch}.tar.gz"
        tmp="$(mktemp -d)"
        curl -fsSL -o "$tmp/$tarball" "$base/$tarball"
        curl -fsSL "$base/caddy_${CADDY_VERSION}_checksums.txt" \
          | grep " ${tarball}\$" | (cd "$tmp" && sha512sum -c -)
        tar -xzf "$tmp/$tarball" -C "$tmp" caddy
        sudo install -m 0755 "$tmp/caddy" /usr/local/bin/caddy
        rm -rf "$tmp"
        caddy version
